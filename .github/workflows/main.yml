name: deploy
on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
    - run: docker build -t saimudike/docker-react -f Dockerfile.dev .
    - run: docker run saimudike/docker-react npm run test -- --watchAll=false
